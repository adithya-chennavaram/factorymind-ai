# TEMPLATE ONLY. Run only on an explicitly approved, already provisioned host.
# Values must come from artifacts/amd_plan.json and a reviewed model revision.
services:
  vllm:
    image: ${VLLM_IMAGE:?Set the tested immutable ROCm image digest}
    container_name: factorymind-vllm
    pull_policy: never
    ports:
      - "127.0.0.1:8000:8000"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    ipc: host
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?Set a private random API key}
      ROCR_VISIBLE_DEVICES: ${AMD_GPU_INDEX:?Set the observed GPU index}
      DO_NOT_TRACK: "1"
    volumes:
      - factorymind-model-cache:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:?Set the model selected from observed VRAM}
      - --revision
      - ${VLLM_MODEL_REVISION:?Pin the reviewed model commit}
      - --served-model-name
      - ${VLLM_SERVED_MODEL:?Use the hardware record deployment alias}
      - --dtype
      - half
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "2"
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - ${VLLM_MEMORY_UTILIZATION:?Use the plan value}
      - --host
      - 0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/v1/models',headers={'Authorization':'Bearer '+os.environ['VLLM_API_KEY']}); urllib.request.urlopen(r,timeout=5).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 180s
    restart: "no"
volumes:
  factorymind-model-cache:
